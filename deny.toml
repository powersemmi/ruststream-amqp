# cargo-deny configuration: the dependency-graph half of the security gate.
# Checks RustSec advisories, license compatibility, duplicate versions, and
# registry sources. Run locally with `just deny`.

[graph]
all-features = true

[advisories]
yanked = "deny"

ignore = [
    # pin-utils is unmaintained and has no successor release. It comes only through wasmtimer,
    # which fe2o3-amqp names for `target_arch = "wasm32"` alone: no build of this crate targets
    # wasm32, so wasmtimer and pin-utils are never compiled.
    { id = "RUSTSEC-2026-0441", reason = "pin-utils comes only through wasmtimer, a wasm32-only dependency of fe2o3-amqp that no build compiles" },
]

[licenses]
# Apache-2.0/MIT-compatible permissive licenses only.
allow = [
    "Apache-2.0",
    "MIT",
    # unicode-ident is (MIT OR Apache-2.0) AND Unicode-3.0; the Unicode license
    # only covers the embedded character tables and is permissive.
    "Unicode-3.0",
    # The fe2o3-amqp TLS tree (rustls, aws-lc-rs, untrusted): ISC, BSD-3-Clause,
    # and MIT-0 are all OSI-approved and permissive.
    "ISC",
    "BSD-3-Clause",
    "MIT-0",
    # webpki-roots ships the Mozilla CA bundle under CDLA-Permissive-2.0, a
    # permissive data license covering the embedded certificate set.
    "CDLA-Permissive-2.0",
    # assert_no_alloc, the failing allocator of the core's no-heap test leg, reached through the
    # framework's `testing` feature; permissive.
    "BSD-1-Clause",
]

[bans]
# clippy::cargo's multiple_crate_versions is allowed in the workspace lints
# because client dependency trees pull unavoidable duplicates; warn (not deny)
# so the report stays visible without blocking on a transitive choice.
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# The examples' test-suite macro lives in the core repository and is not published; it is a
# dev-dependency only, dropped on publish.
allow-git = ["https://github.com/powersemmi/ruststream"]
