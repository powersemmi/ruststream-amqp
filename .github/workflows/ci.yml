name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust ${{ matrix.toolchain }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, msrv]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The MSRV leg follows `rust-version` in Cargo.toml, so an MSRV bump is a one-line change.
      - name: Resolve toolchain
        id: toolchain
        env:
          TOOLCHAIN: ${{ matrix.toolchain }}
        run: |
          if [ "$TOOLCHAIN" = "msrv" ]; then
            TOOLCHAIN="$(sed -n 's/^rust-version *= *"\(.*\)"/\1/p' Cargo.toml)"
            test -n "$TOOLCHAIN"
          fi
          echo "toolchain=$TOOLCHAIN" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.toolchain }}
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        if: matrix.toolchain == 'stable'
        run: cargo fmt --all -- --check

      - name: cargo clippy
        if: matrix.toolchain == 'stable'
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: cargo check (no default features)
        run: cargo check --workspace --no-default-features

      - name: cargo check (all features)
        run: cargo check --workspace --all-targets --all-features

      - name: cargo test (handler-stub only, no live broker)
        run: cargo test --workspace --all-features

  broker-integration:
    name: Broker integration (Artemis)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Start ActiveMQ Artemis
        run: |
          docker run -d --name artemis \
            -p 127.0.0.1:5672:5672 \
            -e ARTEMIS_USER=artemis \
            -e ARTEMIS_PASSWORD=artemis \
            apache/activemq-artemis:latest-alpine

      - name: Wait for Artemis
        timeout-minutes: 2
        run: |
          timeout 90 bash -c 'until docker logs artemis 2>&1 | grep -q "AMQ221007"; do sleep 1; done'
          docker logs artemis | tail -5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run integration + conformance against Artemis
        env:
          AMQP_TEST_URL: amqp://artemis:artemis@127.0.0.1:5672
        run: >-
          cargo test -p ruststream-amqp --all-features
          --test integration_amqp
          --test conformance_amqp
          -- --test-threads=1

      - name: Cleanup
        if: always()
        run: docker rm -f artemis

  security:
    name: Security scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      # Dependency-graph gate: RustSec advisories, license allow-list, duplicate
      # versions, and registry sources, per the checked-in deny.toml. Not path-
      # gated: advisories arrive over time, not only with manifest changes.
      - name: cargo deny
        run: cargo deny check

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: codespell
        run: uvx codespell

      - name: zizmor
        run: uvx zizmor .github/workflows
