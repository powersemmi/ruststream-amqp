[package]
name = "ruststream-amqp"
description = "AMQP 1.0 broker implementation for the RustStream messaging framework (ActiveMQ Artemis, Azure Service Bus, RabbitMQ 4.x, and other AMQP 1.0 brokers)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "../../README.md"
keywords = ["amqp", "amqp10", "messaging", "broker", "ruststream"]
categories = ["asynchronous", "network-programming"]

# `default` is empty and every module beyond the plain broker is behind a feature, so a default
# build on docs.rs publishes a reference with the transactional publisher, the in-process mode
# and the AsyncAPI bindings missing - the ones the crate overview sends readers to.
# Every file under `tests/` is a module of one test binary: one link instead of one per file.
autotests = false

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true

[features]
default = []
# TLS for amqps:// endpoints, forwarded to the client.
rustls = ["fe2o3-amqp/rustls"]
native-tls = ["fe2o3-amqp/native-tls"]
# AMQP 1.0 transactions (transactional posting) behind the client's own gate.
transaction = ["fe2o3-amqp/transaction"]
# The broker's in-process mode: `TestApp::start` connects `AmqpBroker` without a server. A service
# enables it in its dev-dependencies. The conformance harness is a broker-author tool and stays in
# this repo's dev-dependencies, not in the user-facing feature.
testing = ["ruststream/testing"]
# What this crate contributes to a generated AsyncAPI document: the server coordinate's binding,
# the channel binding of a subscription, and the send operation's binding of a publish policy.
asyncapi = ["ruststream/asyncapi", "dep:serde"]

[dependencies]
ruststream = { workspace = true, default-features = false }
fe2o3-amqp.workspace = true
fe2o3-amqp-types.workspace = true
bytes.workspace = true
futures.workspace = true
multishot.workspace = true
# Serializes the AsyncAPI binding bodies; nothing else in the crate needs it.
serde = { version = "1", features = ["derive"], optional = true }
thiserror.workspace = true
tokio.workspace = true
# Reads the broker URL this crate opens the connection's socket from, the way the client's own
# `open` reads it.
url.workspace = true
# Decodes the URL's userinfo into the credentials it stands for; `url` already depends on it.
percent-encoding.workspace = true
tracing.workspace = true

[dev-dependencies]
# The conformance harness drives the testing-feature broker; macros + json power the runnable
# amqp_* examples, and serde decodes their message types. `asyncapi` brings `ruststream::schemars`,
# whose `JsonSchema` a manual registration owes the generated document.
ruststream = { workspace = true, features = [
    "asyncapi",
    "conformance",
    "testing",
    "macros",
    "json",
] }
serde = { version = "1", features = ["derive"] }
# Builds the examples' tests into one test binary (`tests/examples.rs`) instead of a test binary
# per example. It lives in the core repository and is not published: a dev-dependency without a
# version is dropped on publish.
ruststream-example-suite = { git = "https://github.com/powersemmi/ruststream", branch = "main" }
# Reads back the generated AsyncAPI document the binding cases assert on.
serde_json = "1"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time"] }

[[test]]
name = "suite"
path = "tests/main.rs"

# The tests of the examples, one module per example, in a binary of their own beside the suite.
[[test]]
name = "examples"
path = "tests/examples.rs"

# The transactional publisher only exists under the `transaction` feature.
[[example]]
name = "amqp_transaction"
required-features = ["testing", "transaction"]

