[workspace]
resolver = "3"
members = ["crates/ruststream-amqp"]

[workspace.package]
version = "0.7.0"
edition = "2024"
# The floor tracks the core line: ruststream 0.7 requires 1.88, so an older toolchain cannot
# resolve this crate's own dependency.
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/powersemmi/ruststream-amqp"
authors = ["RustStream contributors"]

[workspace.dependencies]
ruststream-amqp = { path = "crates/ruststream-amqp" }

# The floor names the pre-release because cargo excludes pre-releases from a range that does not
# mention one, so `>=0.7.0` alone would not admit `0.7.0-rc.1`. The bound still admits the final
# 0.7.0 and every later 0.7 patch.
ruststream = { version = ">=0.7.0-rc.1, <0.8.0", default-features = false }

fe2o3-amqp = "0.17"
fe2o3-amqp-types = "0.17"
bytes = "1"
futures = "0.3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unreachable_pub = "deny"
missing_docs = "deny"
missing_debug_implementations = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_const_for_fn = "allow"
multiple_crate_versions = "allow"
redundant_pub_crate = "allow"
