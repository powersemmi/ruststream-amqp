[workspace]
resolver = "3"
members = ["crates/ruststream-amqp", "crates/ruststream-amqp-bench"]

[workspace.package]
version = "0.7.2"
edition = "2024"
# The floor tracks the core line: ruststream 0.7 requires 1.95, so an older toolchain cannot
# resolve this crate's own dependency.
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/powersemmi/ruststream-amqp"
homepage = "https://powersemmi.github.io/ruststream-amqp/latest/"
authors = ["RustStream contributors"]

[workspace.dependencies]
ruststream-amqp = { path = "crates/ruststream-amqp" }

ruststream = { version = "0.7", default-features = false }

# The two move together: the client's public API is written in the types crate, so a version of
# `fe2o3-amqp-types` the client was not built against gives every message and terminus type a
# second, incompatible copy. The client's floor is 0.18.2: before it, a send whose delivery the peer
# settled at once could wait forever for an outcome the client had already dropped.
fe2o3-amqp = "0.18.2"
fe2o3-amqp-types = "0.18"
# The client's own encoder: a described value a peer puts in `application-properties` has no text
# form, and its `AMQP` encoding is the one byte form that keeps it whole.
serde_amqp = "0.18"
bytes = "1.2"
futures = "0.3"
# A one-shot channel whose receiver recycles its sender without allocating: the answer slot a
# subscription reuses for every settlement.
multishot = "0.3.2"
# A bounded lock-free queue: the answer slots a subscription keeps free between settlements.
crossbeam-queue = "0.3"
percent-encoding = "2"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
# The examples log `String` fields, which tracing records from 0.1.36 (tracing-core 0.1.28) on.
tracing = "0.1.36"
url = "2"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unreachable_pub = "deny"
missing_docs = "deny"
missing_debug_implementations = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_const_for_fn = "allow"
multiple_crate_versions = "allow"
redundant_pub_crate = "allow"

# What ships is optimized across crate boundaries: the framework is generic to the point where a
# dispatch path is only as cheap as the inlining it gets, and a build that stops at each crate
# boundary is not the one to publish numbers from.
[profile.release]
lto = "fat"

# The benchmarks measure what ships, so they are built the way a release is: the profile inherits
# it whole, and the only addition is the line tables a profile needs to name functions. Debug
# information is metadata and changes no codegen decision.
[profile.bench]
inherits = "release"
debug = "line-tables-only"
