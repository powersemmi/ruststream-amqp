# Locked renderings for the documentation's terms of art.
#
# A machine translation of technical prose does not fail by producing unreadable text; it
# fails by rendering a term of art with a dictionary synonym, so that two pages of the same
# site name the same concept differently and the reader cannot tell whether a distinction is
# meant. Each term below therefore has exactly one rendering per language, and
# `scripts/check_doc_i18n.py` enforces it: where the English page uses a listed term, the
# translated page has to use the locked equivalent.
#
# Two vocabularies meet on these pages, and each keeps its own words. A concept the protocol
# owns (a link, a session, a terminus, a transfer, a disposition, credit, settlement) is named
# the way AMQP 1.0 and its Russian and Chinese literature name it. A concept the framework owns
# (a slot, a mount site, a batch, the partition key, the harness) is named the way the core
# documentation names it, and the two lists below are kept apart for that reason. Where the two
# meet on one page the protocol keeps its word and the framework's concept is qualified rather
# than given a new noun.
#
# Fields:
#   en        the English term, matched case-insensitively on word boundaries
#   en_match  optional regex replacing that default match (for irregular plurals or spellings)
#   ru, zh    the locked rendering, and what a translator must write
#   ru_match  optional regex accepting inflected forms of the Russian rendering
#   zh_match  optional regex, same purpose, rarely needed
#
# A term kept in Latin script in a target language is a deliberate choice, not an oversight:
# `ack`, `trait` and `crate` are what Russian and Chinese Rust texts actually write, and
# replacing them with a translated coinage would make the page harder to read, not easier. The
# same holds for the protocol's own performatives in Chinese (`transfer`, `disposition`) and for
# the two address semantics in Russian (anycast, multicast).
#
# Adding a term here is cheap and retroactive: the check reports every existing translated
# page that does not yet honour it, so add terms only once their rendering is settled.

[[term]]
en = "ack"
ru = "ack"
zh = "ack"

[[term]]
en = "nack"
ru = "nack"
zh = "nack"

[[term]]
en = "broker"
en_match = "brokers?"
ru = "брокер"
ru_match = "брокер"
zh = "Broker"
zh_match = "(?i)broker"

