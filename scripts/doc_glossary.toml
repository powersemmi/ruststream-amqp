# AMQP 1.0's own vocabulary, as the protocol and its Russian and Chinese literature write it.
# The Chinese pages keep the performatives themselves in Latin next to a Chinese head word,
# which is how the protocol is written about in Chinese.

[[term]]
en = "link"
en_match = "(sender|receiver|reply)\\s+links?"
ru = "связь"
ru_match = "связ(ь|и|ью|ей)"
zh = "链路"

[[term]]
en = "session"
en_match = "sessions?"
