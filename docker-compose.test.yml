services:
  artemis:
    image: apache/activemq-artemis:latest-alpine
    ports:
      - "127.0.0.1:5672:5672"
    environment:
      ARTEMIS_USER: artemis
      ARTEMIS_PASSWORD: artemis
      # Netty holds every in-flight AMQP frame in direct memory, and with no ceiling of its own the
      # JVM derives one from the 2G heap the broker ships with. A benchmark run keeps enough
      # deliveries in flight to cross it, and the broker then exits mid-run. The ceiling is a
      # limit, not a reservation: raising it costs nothing until the memory is used.
      JAVA_ARGS_APPEND: -XX:MaxDirectMemorySize=4G
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/activemq-artemis/bin/artemis check node --url tcp://localhost:61616 --user artemis --password artemis",
        ]
      interval: 5s
      timeout: 10s
      retries: 12
