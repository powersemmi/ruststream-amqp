# Two TLS listeners beside the instance's own, with the certificates the stand mounts at /tls.

# Mutual TLS: a client certificate signed by the stand's authority is demanded, and SASL EXTERNAL
# is the only login, so a connection authenticates by its certificate or not at all. Its users
# come from the certificate login domain in login.config.
acceptorConfigurations.mtls.factoryClassName=org.apache.activemq.artemis.core.remoting.impl.netty.NettyAcceptorFactory
acceptorConfigurations.mtls.params.host=0.0.0.0
acceptorConfigurations.mtls.params.port=5671
acceptorConfigurations.mtls.params.protocols=AMQP
acceptorConfigurations.mtls.params.sslEnabled=true
acceptorConfigurations.mtls.params.needClientAuth=true
acceptorConfigurations.mtls.params.keyStoreType=PEM
acceptorConfigurations.mtls.params.keyStorePath=/tls/server.pem
acceptorConfigurations.mtls.params.trustStoreType=PEMCA
acceptorConfigurations.mtls.params.trustStorePath=/tls/ca.crt
acceptorConfigurations.mtls.params.saslMechanisms=EXTERNAL
acceptorConfigurations.mtls.params.securityDomain=amqp-sasl-external

# TLS that verifies the broker alone, with the instance's password login.
acceptorConfigurations.tls.factoryClassName=org.apache.activemq.artemis.core.remoting.impl.netty.NettyAcceptorFactory
acceptorConfigurations.tls.params.host=0.0.0.0
acceptorConfigurations.tls.params.port=5673
acceptorConfigurations.tls.params.protocols=AMQP
acceptorConfigurations.tls.params.sslEnabled=true
acceptorConfigurations.tls.params.keyStoreType=PEM
acceptorConfigurations.tls.params.keyStorePath=/tls/server.pem
